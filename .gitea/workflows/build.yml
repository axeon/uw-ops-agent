name: build
on:
  push:
    branches: [main]
env:
  GRAALVM_IMAGE: container-registry.oracle.com/graalvm/native-image:25

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: |
          # 拉取代码
          source ~/.profile
          GIT_SERVER=${{gitea.server_url}}
          git clone -q ${GIT_SERVER%%://*}://gitea:${{gitea.token}}@${GIT_SERVER#*://}/${{gitea.repository}}.git .

          mkdir -p output

          # Step 1: 打包fat JAR
          echo "Building fat JAR..."
          mvn -B package
          FAT_JAR=$(ls target/uw-ops-agent-*.jar | head -1)

          # 注册QEMU多架构支持
          [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ] || docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

          # Step 2-amd64: native-image容器编译
          echo "Building amd64..."
          docker run --rm --platform linux/amd64 \
            -v "$(pwd):/build" -w /build \
            ${GRAALVM_IMAGE} \
            -Os -march=compatibility --strip-debug-info -R:MaxHeapSize=128m -R:MinHeapSize=8m \
            --enable-native-access=ALL-UNNAMED \
            -o output/uw-ops-agent-amd64 -jar "$FAT_JAR"
          docker run --rm --platform linux/amd64 \
            -v "$(pwd):/build" -w /build \
            --entrypoint /build/output/uw-ops-agent-amd64 \
            ${GRAALVM_IMAGE} \
            -XX:MissingRegistrationReportingMode=Exit --verify-native-metadata

          # Step 3-arm64: native-image容器编译
          echo "Building arm64..."
          docker run --rm --platform linux/arm64 \
            -v "$(pwd):/build" -w /build \
            ${GRAALVM_IMAGE} \
            -Os -march=compatibility --strip-debug-info -R:MaxHeapSize=128m -R:MinHeapSize=8m \
            --enable-native-access=ALL-UNNAMED \
            -o output/uw-ops-agent-arm64 -jar "$FAT_JAR"
          docker run --rm --platform linux/arm64 \
            -v "$(pwd):/build" -w /build \
            --entrypoint /build/output/uw-ops-agent-arm64 \
            ${GRAALVM_IMAGE} \
            -XX:MissingRegistrationReportingMode=Exit --verify-native-metadata

          # 验证产物
          file output/uw-ops-agent-amd64
          file output/uw-ops-agent-arm64

          # 复制到ops-center并提交
          git clone -q ${GIT_SERVER%%://*}://gitea:${{secrets.UW_TOKEN}}@${GIT_SERVER#*://}/uw/uw-ops-center.git
          DOWNLOAD_DIR=uw-ops-center/src/main/resources/public/agent/download
          mkdir -p "$DOWNLOAD_DIR"
          cp -f output/uw-ops-agent-amd64 "$DOWNLOAD_DIR/uw-ops-agent-amd64"
          cp -f output/uw-ops-agent-arm64 "$DOWNLOAD_DIR/uw-ops-agent-arm64"
          cp -f "$FAT_JAR" "$DOWNLOAD_DIR/uw-ops-agent.jar"
          cd uw-ops-center
          git add src/main/resources/public/agent/download/
          git commit -m "uw-ops-agent ci auto build (amd64+arm64)"
          git push origin main
          echo "uw-ops-agent build success!"
